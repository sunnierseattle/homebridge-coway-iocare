name: Feature request
description: Suggest something the plugin should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The outcome you want in HomeKit, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: Optional. How you picture it working.
  - type: input
    id: hardware
    attributes:
      label: Your hardware
      description: Model(s) this would apply to.
